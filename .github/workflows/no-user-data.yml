name: No user data in PRs

# Hard-blocks any PR that adds or modifies user-layer (private data) files, or
# that introduces something shaped like a credential.
#
# This is a DETECTOR, not a preventer: it runs on pull_request, so by the time
# it fails the content is already on GitHub. The preventer is .githooks/
# pre-commit, installed by `npm install` (or `npm run hooks:install`).
#
# Patterns come from user-paths.mjs — the single source of truth shared with the
# pre-commit hook and test-all.mjs. They used to be inlined here and had drifted
# from .gitignore and update-system.mjs, which is how modes/_custom.md,
# data/follow-ups.md and voice-dna.md all ended up unguarded.
#
# SECURITY: this checks out the PR's BASE (trusted) and never executes PR code.
# Changed files and their diffs come from the API (listFiles), so it still works
# for fork PRs without running anything a contributor supplied.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/github-script@v9
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { join } = require('node:path');
            const { isUserData, findSecrets } =
              await import(pathToFileURL(join(process.env.GITHUB_WORKSPACE, 'user-paths.mjs')).href);

            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number, per_page: 100,
            });

            const live = files.filter((f) => f.status !== 'removed');
            const privateFiles = live.map((f) => f.filename).filter(isUserData);

            // Scan only ADDED lines — a diff that REMOVES a key must stay mergeable.
            const secrets = [];
            for (const f of live) {
              if (!f.patch) continue; // binary, or too large for the API to inline
              const added = f.patch
                .split('\n')
                .filter((l) => l.startsWith('+') && !l.startsWith('+++'))
                .join('\n');
              for (const name of findSecrets(added)) secrets.push(`${f.filename}: ${name}`);
            }

            const problems = [];
            if (privateFiles.length) {
              problems.push(
                'This PR adds or modifies user-layer (private data) files. These live ONLY on ' +
                'your machine per DATA_CONTRACT.md and must never be committed — put sample ' +
                'data under examples/ instead.\n  ' + privateFiles.join('\n  '));
            }
            if (secrets.length) {
              problems.push(
                'This PR appears to introduce credentials. Move them to .env (gitignored) and ' +
                'read them via process.env. If a value is a placeholder, use an *.example.* ' +
                'filename.\n  ' + secrets.join('\n  '));
            }

            if (problems.length) {
              core.setFailed(problems.join('\n\n'));
            } else {
              core.info(`OK — ${live.length} changed file(s), no user-layer data and no credentials.`);
            }
