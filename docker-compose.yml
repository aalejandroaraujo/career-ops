services:
  career-ops:
    build:
      context: .
      dockerfile: Dockerfile
    image: career-ops:local
    container_name: career-ops
    working_dir: /app
    # Run UNPRIVILEGED as uid:gid 1000 (the host user), so the batch workers'
    # `claude -p --dangerously-skip-permissions` runs without root, and a
    # prompt-injected JD can't escalate. 1000 matches the host owner of the
    # bind-mounted repo, so writes to reports/ data/ output/ still work.
    user: "1000:1000"
    # Main process is the ingest server (the bridge endpoint). It keeps the
    # container up, so `docker compose exec` / `./cops` still work as before.
    command: ["npm", "run", "ingest"]
    init: true
    # Mount whole project so edits on host are visible inside the container.
    # node_modules is kept inside the image to avoid host/container ABI mismatch
    # (host is ubuntu26.04 where playwright won't install; image is jammy).
    volumes:
      - .:/app
      - career-ops-node-modules:/app/node_modules
      # Container-OWNED Claude home (named volume, not the host's ~/.claude).
      # You `claude /login` once INSIDE the container with your same Max account;
      # the session lives here. The host's credentials are never exposed to the
      # workers, so a prompt-injected JD can't read or tamper with them.
      - careerops-claude-home:/home/cops
    environment:
      - NODE_ENV=development
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
      - HOME=/home/cops
      # Bearer token the ingest endpoint requires. Set it in .env.
      - CAREEROPS_INGEST_TOKEN=${CAREEROPS_INGEST_TOKEN:-}
      # ANTHROPIC_API_KEY is intentionally NOT forwarded: claude -p must use the
      # container's own subscription login, and an env key would override it.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    # Chromium needs a larger /dev/shm than the default 64M.
    shm_size: "1gb"
    # Dashboard TUI is interactive; expose nothing by default but allow `-it`.
    tty: true
    stdin_open: true
    restart: unless-stopped
    # `default` keeps existing behavior; `careerops-bridge` is the shared network
    # Hermes joins so it can reach this container by name (http://career-ops:8765).
    networks:
      - default
      - careerops-bridge

  # MCP server — lets Hermes call career-ops as a native MCP tool (no shell needed).
  # Thin proxy over the ingest server; holds the ingest token so Hermes never sees it.
  # Reachable two ways: on careerops-bridge at http://career-ops-mcp:8766/mcp (for
  # bridge peers), AND on the host loopback at http://127.0.0.1:8766/mcp (for the
  # host-side Hermes agent, which runs as a `hermes` systemd --user process and can't
  # resolve the bridge DNS name). Loopback-only bind keeps it off the LAN; pair with
  # CAREEROPS_MCP_TOKEN (set in .env) for a bearer on the endpoint.
  career-ops-mcp:
    image: career-ops:local
    container_name: career-ops-mcp
    working_dir: /app
    user: "1000:1000"
    command: ["npm", "run", "mcp"]
    init: true
    # Loopback-only host port so the host-side Hermes agent can reach the MCP server.
    ports:
      - "127.0.0.1:8766:8766"
    depends_on:
      - career-ops
    volumes:
      - .:/app
      - career-ops-node-modules:/app/node_modules
    environment:
      - NODE_ENV=development
      # Where to reach the ingest server (same bridge network).
      - CAREEROPS_INGEST_BASE=http://career-ops:8765
      # Server-side token used to call the ingest server (never exposed to the MCP client).
      - CAREEROPS_INGEST_TOKEN=${CAREEROPS_INGEST_TOKEN:-}
      # Optional inbound bearer for the MCP endpoint (defense-in-depth). If unset,
      # the only boundary is the internal careerops-bridge network (no host port).
      - CAREEROPS_MCP_TOKEN=${CAREEROPS_MCP_TOKEN:-}
    restart: unless-stopped
    networks:
      - careerops-bridge

  # Web UI — the LAN front door onto the same tracker Hermes uses.
  #
  # Presentation + proxy ONLY. It has no write authority: the repo is mounted
  # READ-ONLY and every mutation goes to the /tracker/* API on career-ops, which
  # is the sole tracker writer. That matters because the tracker file lock's
  # liveness check (process.kill(pid,0)) only resolves pids inside one PID
  # namespace — a second container writing the files directly could remove a
  # live lock held by merge-tracker and lose rows.
  #
  # It also means a compromise of the only LAN-exposed process here stays a
  # read-only incident, which is worth having next to a container that runs
  # `claude -p` workers with a credentialed home directory.
  career-ops-web:
    image: career-ops:local
    container_name: career-ops-web
    working_dir: /app
    user: "1000:1000"
    command: ["npm", "run", "web"]
    init: true
    # Bound to the LAN address explicitly, never 0.0.0.0.
    #
    # ⚠️ Docker publishes bypass ufw: published ports are DNAT'd in nat/PREROUTING
    # and traverse FORWARD, not INPUT, so ufw's default-deny does NOT cover them.
    # Naming the interface keeps this off every other interface and makes the
    # exposure auditable; CAREEROPS_WEB_PASSWORD is the actual access control.
    # For subnet-level restriction add a DOCKER-USER rule, not a ufw one.
    ports:
      - "192.168.1.16:8767:8767"
    depends_on:
      - career-ops
    volumes:
      - .:/app:ro
      - career-ops-node-modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - CAREEROPS_INGEST_BASE=http://career-ops:8765
      # Held server-side; the browser never sees it.
      - CAREEROPS_INGEST_TOKEN=${CAREEROPS_INGEST_TOKEN:-}
      # Required — the server refuses to start without it (fail-closed).
      - CAREEROPS_WEB_PASSWORD=${CAREEROPS_WEB_PASSWORD:-}
      - CAREEROPS_WEB_PORT=8767
    restart: unless-stopped
    networks:
      - careerops-bridge

volumes:
  career-ops-node-modules:
  # Container-owned Claude Code home (holds the in-container `claude /login`
  # session). Independent of the host's ~/.claude; revoke/rotate separately.
  careerops-claude-home:

networks:
  # Created once on the host: `docker network create careerops-bridge`.
  careerops-bridge:
    external: true
